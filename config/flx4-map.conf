# rb4r5 - extra / overriding DDJ-FLX4 bindings for flx4-bridge.
#
# The bridge has a built-in map covering everything whose XDJ-RX3 keycode is
# known from the earlier ports (transport, browse, load, mixer, EQ, tempo,
# crossfader, filter, jog, pads, Beat FX).  This file binds the rest, or
# changes what the built-in map does, without recompiling anything.
#
# Syntax (# starts a comment; numbers may be decimal or 0x hex):
#
#   note <midi_ch> <note> <keycode> <deck|global|1|2> [name...]
#   cc14 <midi_ch> <msb_cc> <keycode> <rotate|value> <deck|global|1|2> [signed]
#
#   midi_ch is 1-based, as printed by `flx4-bridge -s` (sniff mode).
#   `deck`  = derive the deck from the MIDI channel (deck 1 / deck 2).
#   keycode 0 removes a built-in binding.
#   cc14 assumes the LSB is on <msb_cc>+0x20, which is how the FLX4 sends it.
#
# How to fill one in:
#   1. sudo systemctl stop rb4r5              # free the controller
#   2. /usr/local/bin/flx4-bridge -s          # sniff: press the control
#   3. add a line here with the keycode you want (launch.py keys --list)
#   4. sudo systemctl start rb4r5
#
# --- controls the FLX4 has and the RX3 engine may not -----------------------
#
# Channel CUE (headphone PFL) is note 0x54 on the deck channels.  We could not
# verify the RX3 keycode for per-channel PFL, so it is unbound; if you find it,
# bind it here:
#note 1 0x54 0x0000 deck  channel cue / PFL deck 1
#note 2 0x54 0x0000 deck  channel cue / PFL deck 2
#
# CUE/LOOP CALL left/right (notes 0x51 / 0x53) halve and double the loop:
#note 1 0x51 0x0000 deck  loop halve
#note 1 0x53 0x0000 deck  loop double
#
# SHIFT+CUE (note 0x48) jumps to the track start, SHIFT+RELOOP (0x50) is
# "reloop and stop", SHIFT+LOOP IN/OUT (0x4C / 0x4E) are the loop adjusts.
#
# --- examples ---------------------------------------------------------------
# Send the RX3 TAG LIST key from SHIFT + LOAD 1 instead of SOURCE:
#note 7 0x68 0x0203 global  SHIFT+LOAD1 -> tag list
#
# Drive the RX3 booth knob from the FLX4's headphone level knob:
#cc14 7 0x0D 0x4406 rotate global
#
# Stop the FILTER knobs touching the colour FX:
#cc14 7 0x17 0 value 1

# ---- the level meter lamps -------------------------------------------------
#
# A DDJ-FLX4's channel meter is lit by ONE message whose VALUE is the level:
# ch1 CC 0x02 lights the whole left column.  Those are the defaults, so
# nothing here is needed on an FLX4 - these lines are for a controller that
# numbers them differently, or to turn a column off.
#
#   meter <left|right> ch<n> <cc|note> <number>
#   meter <left|right> off
#
# Find the numbers on other hardware with:
#     sudo python3 launch.py stop
#     sudo python3 launch.py ledsweep --channel 1 --cc
#
# meter left  ch1 cc 0x02
# meter right ch2 cc 0x02

# ---- the MASTER level knob -------------------------------------------------
#
# Most Pioneer controllers wire this one straight to the output and send
# nothing, in which case the on-screen meter cannot follow it and this does
# nothing.  Check yours with:
#
#     sudo python3 launch.py stop
#     sudo python3 launch.py sniff        # then turn the MASTER knob
#
# If a CC appears, put it here and both the screen meter and the controller's
# own level LEDs will follow the knob.
#
#   masterlevel ch<n> cc <number>
#
# masterlevel ch7 cc 0x08
